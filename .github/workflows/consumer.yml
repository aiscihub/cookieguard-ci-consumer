name: Published CookieGuard consumer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consumer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production:
    name: Production packages and source build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund
      - run: npm run test:production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: aiscihub/cookieguard-ai
          ref: 12a09fe322b135ac2a5aec45cae1f880b717575f # ci-v0.1.0
          path: toolkit-source
          persist-credentials: false
      - name: Build the release from a clean production-only source installation
        working-directory: toolkit-source
        run: |
          npm ci --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund
          npm run build
      - run: node scripts/verify-runtime.js toolkit-source
      - run: node scripts/verify-cli.js toolkit-source source
      - run: node scripts/verify-source-packages.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: consumer-production
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  playwright:
    name: Published Playwright with Chromium login
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:playwright
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: consumer-playwright
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  action:
    name: Released remote Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Start the independent local fixture
        run: |
          node scripts/fixture.js > "$RUNNER_TEMP/consumer-fixture.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Secure authentication cookie
        id: secure
        uses: aiscihub/cookieguard-ai/action@12a09fe322b135ac2a5aec45cae1f880b717575f # ci-v0.1.0
        with:
          target: http://127.0.0.1:3000/secure
          auth-cookies: session_id
          artifact-name: consumer-action-secure
      - name: Confirmed missing HttpOnly
        id: insecure
        continue-on-error: true
        uses: aiscihub/cookieguard-ai/action@12a09fe322b135ac2a5aec45cae1f880b717575f # ci-v0.1.0
        with:
          target: http://127.0.0.1:3000/missing-httponly
          auth-cookies: session_id
          artifact-name: consumer-action-insecure
      - name: Expected authentication cookie absent
        id: absent
        continue-on-error: true
        uses: aiscihub/cookieguard-ai/action@12a09fe322b135ac2a5aec45cae1f880b717575f # ci-v0.1.0
        with:
          target: http://127.0.0.1:3000/absent-auth
          auth-cookies: session_id
          artifact-name: consumer-action-absent
      - name: Verify policy enforcement and report privacy
        env:
          CG_CASE_0_CODE: ${{ steps.secure.outputs.exit-code }}
          CG_CASE_0_OUTCOME: ${{ steps.secure.outcome }}
          CG_CASE_0_REPORT: ${{ steps.secure.outputs.report-path }}
          CG_CASE_1_CODE: ${{ steps.insecure.outputs.exit-code }}
          CG_CASE_1_OUTCOME: ${{ steps.insecure.outcome }}
          CG_CASE_1_REPORT: ${{ steps.insecure.outputs.report-path }}
          CG_CASE_2_CODE: ${{ steps.absent.outputs.exit-code }}
          CG_CASE_2_OUTCOME: ${{ steps.absent.outcome }}
          CG_CASE_2_REPORT: ${{ steps.absent.outputs.report-path }}
          CG_FIXTURE_LOG: ${{ runner.temp }}/consumer-fixture.log
        run: node scripts/verify-action.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: consumer-action-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
